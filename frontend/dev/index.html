<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>heating-schedule-card dev</title>
<style>
  body { font-family: Roboto, system-ui, sans-serif; background: #f5f5f5; margin: 0; padding: 16px;
         --primary-color: #03a9f4; --primary-text-color: #212121; --secondary-text-color: #727272;
         --card-background-color: #fff; --divider-color: rgba(0,0,0,.12); --secondary-background-color: #eee; }
  body.dark { background: #111; --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
         --card-background-color: #1c1c1c; --divider-color: rgba(255,255,255,.12); --secondary-background-color: #2a2a2a; color: #e1e1e1; }
  #cards { display: grid; gap: 16px; max-width: 720px; }
  body.panel { padding: 0; } body.panel #cards { max-width: none; display: block; }
  ha-card { display: block; background: var(--card-background-color); border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
</style>
</head>
<body>
<div id="cards"></div>
<script type="module">
  // Minimal stand-ins for HA elements and the hass object.
  customElements.define("ha-card", class extends HTMLElement {});
  customElements.define("ha-switch", class extends HTMLElement {
    set checked(v) { this._c = v; this.textContent = v ? "●" : "○"; } get checked() { return this._c; }
    connectedCallback() { this.style.cursor = "pointer"; this.onclick = () => { this.checked = !this.checked; this.dispatchEvent(new Event("change")); }; }
  });
  // Crude ha-form stand-in: one labelled text box per schema field.
  customElements.define("ha-form", class extends HTMLElement {
    set schema(v) { this._s = v; this._r(); } set data(v) { this._d = v; this._r(); }
    _r() { if (!this._s || !this._d) return; this.innerHTML = this._s.map(f =>
      `<label style="display:block;margin:8px 0">${this.computeLabel?.(f) ?? f.name}<br><input style="width:100%" value="${[].concat(this._d[f.name] ?? "").join(", ")}"></label>`).join(""); }
  });
  const params = new URLSearchParams(location.search);
  if (params.has("dark")) document.body.classList.add("dark");
  await import("../../custom_components/heating_schedule/frontend/heating-schedule-card.js");

  const workday = [{time:"00:00",temp:19},{time:"05:30",temp:21},{time:"08:30",temp:19},{time:"19:00",temp:21},{time:"22:00",temp:19}];
  const weekend = [{time:"00:00",temp:19},{time:"06:30",temp:21},{time:"10:00",temp:19},{time:"19:00",temp:21},{time:"22:30",temp:19}];
  const days = {mon:workday,tue:workday,wed:workday,thu:workday,fri:workday,sat:weekend,sun:weekend};
  let info = { entry_id: "x", title: "Sypialnia", climate_entity: "climate.sypialnia_termostat", enabled: true, days,
    current: { temp: 19, next_change: new Date(new Date().setHours(19,0,0,0)).toISOString(), next_temp: 21 },
    limits: { min: 5, max: 45, step: 1 }, switch_entity: "switch.sypialnia_termostat_harmonogram", sensor_entity: null,
    occupancy_entity: "binary_sensor.sypialnia_termostat_obecnosc",
    presence: { entities: ["binary_sensor.a"], occupied: !params.has("empty") },
    profile: { weeks: 2, days: Object.fromEntries(["mon","tue","wed","thu","fri","sat","sun"].map(d => [d,
      Array.from({ length: 96 }, (_, i) => (i >= 22 && i < 34) || (i >= 76 && i < 92) ? 0.6 + 0.4 * Math.sin(i) ** 2 : (i >= 92 || i < 22) ? 0.9 : 0.05)])) } };
  // ?suggest: two suggestions on the workdays (the card shows them only with settings: true)
  const WD = ["mon","tue","wed","thu","fri"];
  if (params.has("suggest")) info.suggestions = [
    { id: "s1", kind: "shift", days: WD, start: 480, end: 510, temp: 19, params: { from: 510, to: 480, temp: 19 }, source: "data" },
    { id: "s2", kind: "shift", days: WD, start: 1140, end: 1200, temp: 19, params: { from: 1140, to: 1200, temp: 21 }, source: "data" },
  ];
  if (params.has("disabled")) info.enabled = false;
  // ?ai: an AI Task entity exists; ?aifull: a whole week proposed by the AI
  if (params.has("ai")) info.ai_available = true;
  if (params.has("aifull")) info.ai_full = { id: "full-1", week: Object.fromEntries(Object.keys(days).map(d =>
    [d, [{time:"00:00",temp:18},{time:"06:00",temp:21},{time:"09:00",temp:18},{time:"18:30",temp:21},{time:"22:30",temp:18}]])) };
  const subs = [];
  const midnight = new Date(); midnight.setHours(0,0,0,0);
  function history(start) {
    const rows = []; const t0 = new Date(start).getTime(); const end = Math.min(Date.now(), t0 + 864e5);
    let cur = 19.4;
    for (let t = t0; t < end; t += 15 * 60e3) {
      const m = (t - t0) / 60e3; const target = m >= 330 && m < 510 || m >= 1140 && m < 1320 ? 21 : 19;
      cur += (target - cur) * 0.12 + (Math.random() - .5) * .1;
      rows.push({ s: "heat", lu: t / 1000, a: { current_temperature: params.has("round") ? Math.round(cur) : Math.round(cur * 10) / 10, temperature: target, hvac_action: cur < target - 0.2 ? "heating" : "idle" } });
    }
    return rows;
  }
  const hass = {
    language: "pl", locale: { language: "pl" }, user: { is_admin: true },
    states: { "climate.sypialnia_termostat": { entity_id: "climate.sypialnia_termostat", state: params.get("mode") ?? "heat",
      attributes: { friendly_name: "Sypialnia Termostat", current_temperature: 19.6, temperature: 19 } },
      "number.sypialnia_termostat_deadzone_temperature": { entity_id: "number.sypialnia_termostat_deadzone_temperature", state: params.get("band") ?? "1", attributes: {} },
      "climate.biuro_termostat": { entity_id: "climate.biuro_termostat", state: "off",
      attributes: { friendly_name: "Biuro Termostat", current_temperature: 20.8, temperature: 21 } } },
    connection: { subscribeMessage: async (cb, msg) => { subs.push(cb); setTimeout(() => cb(info)); return async () => {}; } },
    callWS: async (msg) => {
      if (msg.type === "history/history_during_period") {
        const t0 = new Date(msg.start_time).getTime() / 1000;
        return { [msg.entity_ids[0]]: history(msg.start_time),
          "binary_sensor.sypialnia_termostat_obecnosc": [{ s: "on", lu: t0 }, { s: "off", lu: t0 + 6.6 * 3600 }, { s: "on", lu: t0 + 7 * 3600 }, { s: "off", lu: t0 + 8.4 * 3600 }] };
      }
      if (msg.type === "heating_schedule/save") { info = { ...info, ...(msg.days ? { days: msg.days } : {}), ...(msg.enabled !== undefined ? { enabled: msg.enabled } : {}) }; subs.forEach(cb => cb(info)); window.lastSave = msg; return info; }
      if (msg.type === "brands/access_token") return { token: "dev" };
      if (msg.type === "heating_schedule/suggestion/ask_ai") {
        info = { ...info, suggestions: [...(info.suggestions ?? []),
          { id: "a1", kind: "temp", days: WD, start: 1320, end: 1440, temp: 18, params: { start: 1320, end: 1440, temp: 18, from_temp: 19 }, source: "ai" }] };
        return { count: 1, info };
      }
      if (msg.type.startsWith("heating_schedule/suggestion/")) {
        info = { ...info, suggestions: info.suggestions.filter((x) => x.id !== msg.suggestion_id) };
        subs.forEach(cb => cb(info)); window.lastSuggestion = msg; return msg.type.endsWith("apply") ? info : null;
      }
      if (msg.type === "heating_schedule/list") return ["climate.sypialnia_termostat", "climate.biuro_termostat"]
        .map((id, i) => ({ entry_id: String(i), title: id, climate_entity: id }));
      throw { code: "unknown", message: msg.type };
    },
  };
  // ?panel renders the sidebar panel instead of a single card.
  if (params.has("panel")) {
    document.body.classList.add("panel");
    const panel = document.createElement("heating-schedule-panel");
    panel.hass = hass;
    document.getElementById("cards").append(panel);
  }
  for (const cfg of params.has("panel") ? [] : [{ entity: "climate.sypialnia_termostat" }]) {
    // ?chart: the read-only dashboard chart card (?name=… shows a title)
    const card = document.createElement(params.has("chart") ? "heating-schedule-chart-card" : "heating-schedule-card");
    card.setConfig({ type: "custom:heating-schedule-card", name: params.get("name") ?? undefined, settings: params.has("suggest") || params.has("ai") || params.has("aifull"), ...cfg });
    card.hass = hass;
    document.getElementById("cards").append(card);
    // ?variant=a|b|c: mock-up styles for a disabled schedule (injected into the card)
    const BASE = `ha-card { display: block; background: var(--card-background-color); border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.2); }`;
    const VARIANTS = {
      none: "",
      a: `ha-card > :not(.header) { filter: grayscale(0.9); opacity: 0.55; } .name { opacity: 0.6; }`,
      b: `ha-card { background: color-mix(in srgb, var(--card-background-color, #fff) 86%, #000); }
          ha-card > :not(.header) { filter: grayscale(0.75) brightness(0.92); opacity: 0.7; } .name { opacity: 0.7; }`,
      c: `ha-card > :not(.header) { filter: grayscale(0.9); opacity: 0.6; } .name { opacity: 0.6; }
          .chart { position: relative; }
          .chart::after { content: "Harmonogram wyłączony"; position: absolute; inset: 0 0 24px 30px; display: flex;
            align-items: center; justify-content: center; font-weight: 600; letter-spacing: .02em;
            color: var(--primary-text-color); background: repeating-linear-gradient(45deg, transparent 0 8px, rgba(127,127,127,.14) 8px 16px); }`,
    };
    const variant = VARIANTS[params.get("variant")];
    if (variant !== undefined) customElements.whenDefined("heating-schedule-card").then(async () => {
      await card.updateComplete; const st = document.createElement("style"); st.textContent = BASE + variant; card.shadowRoot.append(st);
    });
  }
  window.hass = hass;
</script>
</body>
</html>
